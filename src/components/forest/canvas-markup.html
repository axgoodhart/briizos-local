<!--
  Ported from Projungle's legacy canvas DOM. Element IDs and a handful of
  collision-prone class names (.hidden, .empty-state, .drop-overlay, the
  .app-shell root) were prefixed with forest- during the briizOS.local
  hardening pass, since this markup now shares a document with the rest of
  the app instead of living in its own standalone window. app.js was updated
  to match — keep the two in sync if either changes.
-->
<div class="forest-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <h1>f<span>􁞔</span>rest</h1>
      </div>
      <div class="status-pills">
        <span id="forest-projectCount" class="stat-pill">0 projects</span>
        <span id="forest-fileCount" class="stat-pill">0 files</span>
        <span id="forest-zoomReadout" class="stat-pill">100%</span>
        <span id="forest-saveState" class="stat-pill subtle">Ready</span>
        <button id="forest-sortActivityBtn" class="stat-pill sort-btn" title="Sort by recent file activity">↕ Activity</button>
      </div>
    </div>

    <div class="toolbar">
      <button
        id="forest-collapseAllBtn"
        class="collapse-all-btn"
        type="button"
        data-state="mini"
        aria-label="All projects are already mini"
        title="All projects are already mini"
        disabled
      > 
      <span>􀋰</span>
      </button>
      <div class="search-wrap">
        <input
          id="forest-searchInput"
          type="text"
          autocomplete="off"
          placeholder="Search projects, file names, or #tags"
        />
      </div>
      <button id="forest-resetViewBtn" class="ghost-btn" type="button">
        Reset view
      </button>
      <button id="forest-fitBtn" class="ghost-btn" type="button">
        Fit projects
      </button>
      <button id="forest-changesBtn" class="ghost-btn" type="button" title="Changes — auto tags and File Hunter results">Changes</button>
      <button id="forest-filehawkBtn" class="ghost-btn" type="button" title="FileHawk — file integrity">FileHawk</button>
    </div>
  </header>

  <main id="forest-stage" class="stage" tabindex="-1">
    <div id="forest-grid" class="grid"></div>
    <div id="forest-world" class="world"></div>
    <div id="forest-emptyState" class="forest-empty-state"></div>

    <div id="forest-dropOverlay" class="forest-drop-overlay forest-hidden">
      <div class="drop-panel">
        <div class="drop-icon">+</div>
        <h2>Drop files or folders to build your space</h2>
        <p>
          Projungle will create expandable projects, infer tags automatically,
          and keep your original files right where they are.
        </p>
      </div>
    </div>
  </main>

  <div class="tag-strip-ground" aria-hidden="true"></div>
  <aside id="forest-tagStrip" class="tag-strip"></aside>

  <button id="forest-dimToggle" class="dim-toggle" title="Toggle dim mode">
    <span class="dim-toggle-symbol" aria-hidden="true">􀛭</span>
  </button>

  <!-- Project Viewer overlay -->
  <div id="forest-projectViewer" class="viewer-overlay forest-hidden"></div>

  <!-- FileHawk relocate panel -->
  <div id="forest-hunterPanel" class="hunter-panel cv-slideout forest-hidden"></div>

  <!-- Changes modal: auto tags and File Hunter results -->
  <div id="forest-changesModal" class="forest-changes-overlay forest-hidden"></div>

  <!-- FileHawk integrity panel -->
  <div id="forest-filehawkPanel" class="cv-slideout forest-hidden"></div>
</div>
