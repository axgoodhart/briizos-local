<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Gossamer Onboarding</title>
    <style>
        :root {
            --bg-deep: #020205;
            --neon-cyan: #00f2ff;
            --neon-purple: #ff0000;
            --neon-pink: #ff00c8;
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-main: "Forma DJR Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
            --font-input: "LTC Bodoni 175"
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: crosshair;
        }

        body {
            background-color: var(--bg-deep);
            color: #fff;
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Liminal Space Atmosphere */
        .liminal-stage {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 50% 50%, rgba(112, 0, 255, 0.05) 0%, transparent 70%),
                radial-gradient(circle at 20% 30%, rgba(0, 242, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 200, 0.03) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        /* Central Orb System */
        .orb-anchor {
            position: absolute;
            top: 10%;
            left: 25%;
            width: 50vw;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .orb-core {
            position: relative;
            transition:all 1s ease;
            width: 180px;
            filter: blur(0px)hue-rotate(0px)contrast(1);;
            height: 180px;
            background: radial-gradient(circle at bottom center, pink, cyan, lightgreen);;
            border-radius: 50%;
            box-shadow: 
                0 0 20px #fff,
                0 0 60px var(--neon-cyan),
                0 0 100px var(--neon-purple);
            animation: orb-pulse 2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            z-index: 10;
        }

        .orb-shroud {
            position: absolute;
            width: 240px;
            height: 240px;
            background:linear-gradient(deeppink, transparent, teal);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter:blur(20px);
            animation: rotate-slow 12s linear infinite;
        }

        /* Fused Neon Gossamer Strands */
        .gossamer-ring {
                position: absolute;
    border: 0.5px solid transparent;
    border-top: 10.5px solid var(--neon-cyan);
    border-bottom: 10.5px solid var(--neon-pink);
    border-radius: 50%;
    opacity: 0.4;
    animation: rotate-fast 8s linear infinite;
    mix-blend-mode: screen;
    filter: blur(10px);
        }

        .ring-1 { width: 180px; height: 180px; animation-duration: 7s; }
        .ring-2 { width: 220px; height: 220px; animation-duration: 11s; animation-direction: reverse; }
        .ring-3 { width: 260px; height: 260px; animation-duration: 15s; }

        /* Particles */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
        }

        /* UI Overlay */
        .interface-layer {
            backdrop-filter:blur(4px);
            position: relative;
            z-index: 20;
            text-align: center;
            max-width: 600px;
            width: 90%;
            margin-top: 30%;
            opacity: 0;
            animation: fade-in-up 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s;
            padding-top:13px;
            border-radius:40px;
        }

        .data-header {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--neon-cyan);
            margin-bottom: 24px;
            opacity: 0.8;
                        animation: fade-in-up 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s;

        }

        .interview-prompt {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 40px;
            letter-spacing: -0.01em;
            background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.4) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
                        animation: fade-in-up 5.5s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s;

        }

        .input-container {
            position: relative;
            width: 100%;
            display:flex;
            padding:0;
            height: 60px;
            backdrop-filter:blur(4px);
        }

        .gossamer-input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 4px 0;
            color: #fff;
            font-size: 2rem;
            font-family: var(--font-input);
            outline: none;
            transition: all 0.4s ease;
            text-align: center;
        }

        .gossamer-input:focus {
            border-bottom-color: var(--neon-cyan);
            letter-spacing: 0.05em;
        }

        .input-glow {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            transform: translateX(-50%);
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            filter: blur(2px);
        }

        .gossamer-input:focus + .input-glow {
            width: 100%;
        }

        .action-hint {
            margin-top: 24px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.1em;
        }

        /* Animations */
        @keyframes orb-pulse {
            0%, 100% { transform: scale(1);  }

            50% { transform: scale(1.05); }
        }

        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotate-fast {
            from { transform: rotate(0deg) rotateX(60deg); }
            to { transform: rotate(360deg) rotateX(60deg); }
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes particle-orbit {
            0% { transform: rotate(0deg) translateX(120px) rotate(0deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: rotate(360deg) translateX(120px) rotate(-360deg); opacity: 0; }
        }

        /* Accessibility: Reduce Motion */
        @media (prefers-reduced-motion: reduce) {
            .orb-core, .orb-shroud, .gossamer-ring, .particle {
                animation: none;
            }
        }
    </style>
</head>
<body>

    <div class="liminal-stage">
        <div class="orb-anchor" id="orbContainer">
            <div class="orb-shroud"></div>
            <div class="orb-core"></div>
            <div class="gossamer-ring ring-1"></div>
            <div class="gossamer-ring ring-2"></div>
            <div class="gossamer-ring ring-3"></div>
            <!-- Particles will be injected here -->
        </div>

        <div class="interface-layer">
            <div class="data-header">Session // Initialize // Core_Values</div>
            <h1 class="interview-prompt" id="promptText">What should I call you?</h1>
            
            <div class="input-container">
                <input type="text" class="gossamer-input" placeholder="Speak your truth..." spellcheck="false" autocomplete="off">
                <div class="input-glow"></div>
            </div>
            
            <div class="action-hint">PRESS [ENTER] TO COMMIT TO MEMORY</div>
        </div>
    </div>

    <script>
        const orbContainer = document.getElementById('orbContainer');
        const particleCount = 40;

        // Create orbiting particles
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            // Randomize properties
            const delay = Math.random() * 5;
            const duration = 3 + Math.random() * 7;
            const size = Math.random() * 3;
            const distance = 80 + Math.random() * 100;
            
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = '50%';
            particle.style.top = '50%';
            
            // Custom animation for each particle
            const animName = `orbit-${i}`;
            const keyframes = `
                @keyframes ${animName} {
                    0% { transform: translate(-50%, -50%) rotate(${Math.random() * 360}deg) translateX(${distance}px); opacity: 0; }
                    20% { opacity: ${Math.random() * 0.8 + 0.2}; }
                    80% { opacity: ${Math.random() * 0.8 + 0.2}; }
                    100% { transform: translate(-50%, -50%) rotate(${Math.random() * 360 + 360}deg) translateX(${distance}px); opacity: 0; }
                }
            `;
            
            const styleSheet = document.createElement("style");
            styleSheet.innerText = keyframes;
            document.head.appendChild(styleSheet);
            
            particle.style.animation = `${animName} ${duration}s linear infinite`;
            particle.style.animationDelay = `-${delay}s`;
            
            // Neon tint
            const colors = ['#00f2ff', '#7000ff', '#ff00c8', '#ffffff'];
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            particle.style.boxShadow = `0 0 8px ${particle.style.background}`;

            orbContainer.appendChild(particle);
        }

        // Interaction logic
        const input = document.querySelector('.gossamer-input');
        const promptText = document.getElementById('promptText');
        const prompts = [
            "What is the heaviest feeling you are currently carrying?",
            "If your discipline was an animal, where would it be?",
            "Identify the one habit that acts as your anchor.",
            "How do you feel about your body?",
            "If you could see your potential as a place to occupy, what would it be?",
            "What are you most afraid of?",
            "Do you spend more time thinking than doing?",
            "How do you deal with loss?"
        ];
        let currentPrompt = 0;
                document.querySelector('.orb-core').style.filter='blur(0px)hue-rotate(0deg)contrast(1)';

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value.trim() !== "") {
                // Flash effect

                document.querySelector('.orb-core').style.filter='blur(13px)hue-rotate(360deg)contrast(6)';
                document.querySelector('.orb-core').style.height = '350px';
                document.querySelector('.orb-core').style.width = '350px';
                setTimeout(() => {
                                    document.querySelector('.orb-core').style.filter='blur(0px)hue-rotate(0px)invert(1)';
                    document.querySelector('.orb-core').style.width = '180px';
                    document.querySelector('.orb-core').style.height = '180px';
                }, 2200);

                // Transition prompt
                input.style.opacity = '0';
                promptText.style.opacity = '0';
                promptText.style.transform = 'translateY(-10px)';

                setTimeout(() => {
                    currentPrompt = (currentPrompt + 1) % prompts.length;
                    promptText.innerText = prompts[currentPrompt];
                    input.value = "";
                    input.style.opacity = '1';
                    promptText.style.opacity = '1';
                    promptText.style.transform = 'translateY(0)';
                }, 600);
            }
        });


        input.addEventListener('focus', () => {
            document.querySelector('.orb-core').style.animation = 'none';
            document.querySelector('.orb-core').style.transform='scale(0) !important';
        });

        //orb opacity and orb border opacity affected by mouse move
        document.addEventListener('mousemove', (e) => {
            const { clientX, clientY } = e;
            const { left, top, width, height } = orbContainer.getBoundingClientRect();
            const centerX = left + width / 2;
            const centerY = top + height / 2;
            const distance = Math.sqrt((clientX - centerX) ** 2.15 + (clientY - centerY) ** 2.15);
            const maxDistance = Math.max(width, height);
            const opacity = 1 - distance / maxDistance;
            document.querySelector('.orb-core').style.opacity = opacity;
            document.querySelector('.orb-core').style.border = `1px solid rgba(255, 255, 255, ${opacity})`;
        });
    </script>
</body>
</html>
