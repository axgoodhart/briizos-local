<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Default Gradient</title>
  <style>
    html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden;     background: linear-gradient(-200deg,rgba(0, 0, 0, 0.45) 0%, #000000 5%, rgb(12, 12, 40,.5) 50%, rgba(0, 0, 0, 0) 90%), linear-gradient(to top,rgb(113, 36, 12) 0%, #5f0a3e 10%, rgb(12, 12, 40) 50%, black 90%);
background-size: cover; animation: rotationne 2000s linear infinite; }
@keyframes rotationne { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
    #bg { position:fixed; inset:0; }
  </style>
</head>
<body>
  
  <div id="bg"></div>
  <script>
  </script>
</body>
</html>
