
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vellum Forest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
    :root {
        --paper: #E6E2D6;
        --paper-shadow: #D1CDBF;
        --charcoal: #1A1A1A;
        --charcoal-light: #3A3A3A;
        --ink-faint: rgba(26, 26, 26, 0.1);
        --ink-med: rgba(26, 26, 26, 0.4);
        --ink-heavy: rgba(26, 26, 26, 0.95);
        --accent: #8C2F2F; /* Dried blood/Burnt Sienna */
        --font-display: 'Cormorant Garamond', serif;
        --font-mono: 'Space Mono', monospace;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: var(--paper);
        color: var(--charcoal);
        font-family: var(--font-display);
        cursor: crosshair;
    }

    /* --- Texture & Filters --- */
    
    .vellum-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 100;
        opacity: 0.6;
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.4'/%3E%3C/svg%3E");
    }

    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 101;
        background: radial-gradient(circle, transparent 60%, rgba(20, 20, 15, 0.2) 100%);
    }

    /* --- Canvas Container --- */

    #stage {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        filter: url(#rough-edges) contrast(1.1) sepia(0.2);
    }

    canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
    }

    /* --- UI Layer --- */

    .ui-layer {
        position: absolute;
        z-index: 200;
        padding: 2rem;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid var(--charcoal);
        padding-bottom: 1rem;
        position: relative;
    }

    header::after {
        content: '';
        position: absolute;
        bottom: -3px;
        left: 0;
        width: 100%;
        height: 1px;
        background: var(--charcoal);
        opacity: 0.3;
        transform: scaleX(0.98);
    }

    h1 {
        font-size: 3rem;
        font-weight: 300;
        font-style: italic;
        letter-spacing: -0.02em;
        line-height: 0.9;
        text-transform: lowercase;
    }

    .meta {
        text-align: right;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        line-height: 1.4;
        opacity: 0.8;
    }

    .meta span {
        display: block;
    }

    .controls {
        display: flex;
        gap: 2rem;
        align-items: flex-end;
    }

    .readout {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        width: 200px;
    }

    .data-row {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px dashed rgba(26,26,26,0.3);
        padding-bottom: 2px;
    }

    .nav-dial {
        pointer-events: auto;
        width: 60px;
        height: 60px;
        border: 1px solid var(--charcoal);
        border-radius: 50%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .nav-dial:hover {
        transform: scale(1.1);
        background: rgba(26,26,26,0.05);
    }

    .nav-dial::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1px;
        height: 100%;
        background: var(--charcoal);
        transform: translate(-50%, -50%) rotate(45deg);
    }
    
    .nav-dial::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 1px;
        background: var(--charcoal);
        transform: translate(-50%, -50%) rotate(45deg);
    }

    .loader {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        font-family: var(--font-mono);
        font-size: 4rem;
        opacity: 0.1;
        font-weight: 700;
        z-index: 50;
    }

    /* --- SVG Filter Visibility --- */
    .svg-filters {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
    }

</style>
</head>
<body>

    <!-- SVG Filters for Organic Distortion -->
    <div class="svg-filters">
        <svg>
            <defs>
                <!-- Creates the rough, bleeding ink edge -->
                <filter id="rough-edges">
                    <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" result="noise" />
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
                    <feGaussianBlur stdDeviation="0.5" />
                </filter>
            </defs>
        </svg>
    </div>

    <div class="vellum-overlay"></div>
    <div class="vignette"></div>

    <div id="stage">
        <!-- Canvases will be injected here -->
    </div>

    <div class="ui-layer">
        <header>
            <h1>Sylva<br>Obscura</h1>
            <div class="meta">
                <span>LAT: 45.92° N</span>
                <span>LON: 12.33° E</span>
                <span>ELEV: <span id="elev-disp">1204</span>M</span>
            </div>
        </header>

        <div class="loader" id="sector-display">01</div>

        <div class="controls">
            <div class="readout">
                <div class="data-row">
                    <span>VELOCITY</span>
                    <span id="vel-disp">12.4 KT</span>
                </div>
                <div class="data-row">
                    <span>DENSITY</span>
                    <span>HIGH</span>
                </div>
                <div class="data-row">
                    <span>LAYER_DEPTH</span>
                    <span>3X</span>
                </div>
                <div class="data-row" style="margin-top: 10px; border:none; font-size: 0.6rem; opacity: 0.6;">
                    // GENERATIVE_SEED: <span id="seed-disp">8842</span>
                </div>
            </div>

            <div class="nav-dial" id="toggle-btn"></div>
        </div>
    </div>

<script>
/**
 * GENERATIVE ENGINE
 * Concept: Multi-layered parallax forest using procedural fractal trees.
 * Style: Charcoal sketch on vellum.
 */

const CONFIG = {
    layerCount: 3,
    baseSpeed: 0.5,
    treeColors: ['rgba(50,50,50,0.3)', 'rgba(30,30,30,0.6)', 'rgba(10,10,10,0.95)'], // Back to Front
    lineWidths: [1, 2, 3],
    blurAmounts: [2, 1, 0],
    scales: [0.6, 0.8, 1.1]
};

const stage = document.getElementById('stage');
let isPaused = false;
let globalTime = 0;

// Utility: Random Range
const random = (min, max) => Math.random() * (max - min) + min;

// Utility: Rough Line (Simulates hand jitter)
function drawRoughLine(ctx, x1, y1, x2, y2, width, color) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    
    // Draw main line
    ctx.moveTo(x1, y1);
    
    // Create bezier curve for organic feel instead of straight line
    const midX = (x1 + x2) / 2 + random(-2, 2);
    const midY = (y1 + y2) / 2 + random(-2, 2);
    
    ctx.quadraticCurveTo(midX, midY, x2, y2);
    ctx.stroke();

    // Secondary "sketch" stroke (fainter, offset)
    if (Math.random() > 0.3) {
        ctx.beginPath();
        ctx.lineWidth = width * 0.5;
        ctx.strokeStyle = color.replace('0.95', '0.3').replace('0.6', '0.2').replace('0.3', '0.1');
        ctx.moveTo(x1 + random(-2, 2), y1);
        ctx.lineTo(x2 + random(-2, 2), y2);
        ctx.stroke();
    }
}

// Class: Tree
// Recursive fractal generation
class Tree {
    constructor(x, y, size, layerIndex) {
        this.x = x;
        this.y = y;
        this.size = size;
        this.layerIndex = layerIndex;
        this.angle = -Math.PI / 2; // Point up
        this.branches = [];
        this.generate(this.x, this.y, this.size, this.angle, 0);
    }

    generate(x, y, length, angle, depth) {
        if (depth > 5 || length < 5) return;

        const x2 = x + Math.cos(angle) * length;
        const y2 = y + Math.sin(angle) * length;

        this.branches.push({ x1: x, y1: y, x2: x2, y2: y2, depth: depth });

        // Recursive branching
        const branchCount = Math.floor(random(1, 3.5)); // 1 to 3 branches
        for (let i = 0; i < branchCount; i++) {
            const newLen = length * random(0.6, 0.8);
            const newAngle = angle + random(-0.5, 0.5);
            this.generate(x2, y2, newLen, newAngle, depth + 1);
        }
    }

    draw(ctx) {
        this.branches.forEach(b => {
            const w = Math.max(0.5, (CONFIG.lineWidths[this.layerIndex] * (5 - b.depth)) / 2);
            drawRoughLine(ctx, b.x1, b.y1, b.x2, b.y2, w, CONFIG.treeColors[this.layerIndex]);
        });
    }
}

// Class: Layer
// Manages a canvas element and a pool of trees
class Layer {
    constructor(index) {
        this.index = index;
        this.speed = (index + 1) * CONFIG.baseSpeed;
        this.canvas = document.createElement('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.trees = [];
        this.offset = 0;
        
        stage.appendChild(this.canvas);
        this.resize();
        
        // Initial Population
        this.populate();
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        // Blur background layers for depth of field
        if(CONFIG.blurAmounts[this.index] > 0) {
            this.canvas.style.filter = `blur(${CONFIG.blurAmounts[this.index]}px)`;
        }
    }

    populate() {
        // Density increases with distance (lower index) usually, but for visual clarity:
        // Back layer: Dense, small. Front layer: Sparse, large.
        const density = 200 - (this.index * 50); 
        const count = Math.ceil(this.canvas.width / density) + 2;
        
        for (let i = 0; i < count; i++) {
            this.addTree(i * density + random(-50, 50));
        }
    }

    addTree(xPos) {
        const sizeBase = 100 * (this.index + 1);
        const yPos = this.canvas.height;
        this.trees.push(new Tree(xPos, yPos, sizeBase * random(0.8, 1.5), this.index));
    }

    update() {
        if(isPaused) return;

        this.offset -= this.speed;
        
        // If a tree moves completely off screen left, remove it and add one to the right
        if (this.trees.length > 0) {
            const firstTree = this.trees[0];
            // Check if tree is roughly off screen (buffer of 300px)
            if (firstTree.x + this.offset < -300) {
                this.trees.shift();
                
                const lastTree = this.trees[this.trees.length - 1];
                const density = 200 - (this.index * 50);
                this.addTree(lastTree.x + density + random(-20, 100));
            }
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.save();
        this.ctx.translate(this.offset, 0);
        
        // Use composite operation to blend strokes like ink
        this.ctx.globalCompositeOperation = 'multiply';

        this.trees.forEach(tree => tree.draw(this.ctx));
        
        this.ctx.restore();
    }
}

// --- Main Controller ---

const layers = [];

function init() {
    for(let i = 0; i < CONFIG.layerCount; i++) {
        layers.push(new Layer(i));
    }
    
    // UI Updates
    setInterval(() => {
        if(!isPaused) {
            document.getElementById('elev-disp').innerText = Math.floor(1200 + Math.sin(Date.now() * 0.001) * 50);
            document.getElementById('vel-disp').innerText = (12.4 + Math.random()).toFixed(1) + " KT";
        }
    }, 500);

    // Sector Updater
    setInterval(() => {
        if(!isPaused) {
            const sec = document.getElementById('sector-display');
            let val = parseInt(sec.innerText) + 1;
            if (val < 10) val = "0" + val;
            sec.innerText = val;
        }
    }, 5000);
}

function loop() {
    globalTime++;
    layers.forEach(layer => {
        layer.update();
        layer.draw();
    });
    requestAnimationFrame(loop);
}

// Interaction
window.addEventListener('resize', () => {
    layers.forEach(l => {
        l.resize();
        l.trees = []; // clear
        l.populate(); // repopulate
        l.offset = 0;
    });
});

document.getElementById('toggle-btn').addEventListener('click', () => {
    isPaused = !isPaused;
    document.getElementById('vel-disp').innerText = isPaused ? "0.0 KT" : "12.4 KT";
});

// Seed
document.getElementById('seed-disp').innerText = Math.floor(Math.random() * 9999);

// Start
init();
loop();

</script>
</body>
</html>
