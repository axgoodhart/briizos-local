<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism Weaver Habitat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1a4f3a 0%, #2d7a5f 50%, #87ceeb 100%);
            cursor: crosshair;
        }

        .scene-container {
            width: 100vw;
            height: 100vh;
            perspective: 1000px;
            position: relative;
            overflow: hidden;
        }

        .parallax-layer {
            position: absolute;
            width: 120%;
            height: 120%;
            transform-style: preserve-3d;
        }

        /* Background layers - furthest */
        .sky-layer {
            transform: translateZ(-800px) scale(1.8);
            background: linear-gradient(to bottom, 
                #87ceeb 0%, 
                #98fb98 30%, 
                #90ee90 70%, 
                #228b22 100%);
            filter: blur(2px);
        }

        .distant-trees {
            transform: translateZ(-600px) scale(1.6);
            background: repeating-linear-gradient(
                90deg,
                #2d5016 0px,
                #2d5016 20px,
                #1e3a0f 20px,
                #1e3a0f 25px,
                #3d6b23 25px,
                #3d6b23 45px
            );
            opacity: 0.7;
            filter: blur(1px);
        }

        /* Mid-ground forest */
        .forest-canopy {
            transform: translateZ(-400px) scale(1.4);
            background: radial-gradient(ellipse at center,
                #228b22 0%,
                #006400 35%,
                #2d5016 70%,
                #1a3d0a 100%);
            clip-path: polygon(0 60%, 15% 45%, 25% 50%, 35% 40%, 50% 45%, 65% 35%, 75% 40%, 85% 30%, 100% 35%, 100% 100%, 0 100%);
        }

        .tree-trunks {
            transform: translateZ(-350px) scale(1.35);
            background: repeating-linear-gradient(
                90deg,
                transparent 0px,
                transparent 80px,
                #4a4a4a 80px,
                #4a4a4a 85px,
                transparent 85px,
                transparent 120px,
                #5d4037 120px,
                #5d4037 125px
            );
            height: 100%;
            opacity: 0.8;
        }

        /* Foreground elements */
        .forest-floor {
            transform: translateZ(-200px) scale(1.2);
            background: linear-gradient(45deg,
                #3d2914 0%,
                #5d4037 25%,
                #4a5d23 50%,
                #2d4a14 75%,
                #1e3a0f 100%);
            height: 100%;
            clip-path: polygon(0 75%, 100% 70%, 100% 100%, 0 100%);
        }

        .vegetation {
            transform: translateZ(-150px) scale(1.15);
            background: repeating-conic-gradient(
                from 45deg at 20% 80%,
                #228b22 0deg 30deg,
                #32cd32 30deg 60deg,
                #006400 60deg 90deg,
                #228b22 90deg 120deg
            );
            opacity: 0.6;
            clip-path: polygon(0 80%, 10% 75%, 20% 78%, 30% 72%, 45% 76%, 60% 70%, 75% 74%, 85% 68%, 95% 72%, 100% 75%, 100% 100%, 0 100%);
        }

        /* Light rays through canopy */
        .light-rays {
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                transparent 0px,
                rgba(255, 255, 180, 0.1) 50px,
                transparent 100px,
                transparent 150px,
                rgba(255, 255, 180, 0.15) 200px,
                transparent 250px
            );
            transform: translateZ(-100px);
            animation: lightShift 8s ease-in-out infinite;
        }

        /* The Prism Weaver Bug */
        .prism-weaver {
            position: absolute;
            width: 60px;
            height: 40px;
            left: 45%;
            top: 40%;
            transform: translateZ(50px);
            animation: bugFloat 4s ease-in-out infinite;
            z-index: 100;
        }

        .bug-body {
            position: absolute;
            width: 30px;
            height: 15px;
            background:radial-gradient(ellipse at center, rgba(0, 0, 255, 0.4), rgba(255, 201, 51, 0.75)), linear-gradient(835deg,red,orange,skyblue,pink,yellow,Orange,red);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            left: 15px;
            top: 12px;
            box-shadow: 0 0 8px rgba(239, 212, 145, 0.6);
        }

        .wing {
            position: absolute;
            width: 25px;
            height: 25px;
            background: linear-gradient(45deg,
                rgba(255, 255, 255, 0.1) 0%,
                rgba(255, 215, 0, 0.3) 25%,
                rgba(255, 165, 0, 0.4) 50%,
                rgba(255, 20, 147, 0.3) 75%,
                rgba(138, 43, 226, 0.2) 100%
            );
            border: 1px solid rgba(255, 215, 0, 0.5);
        }

        .wing-left {
            left: 37px;
            top: -4px;
            border-radius:2px 20px;
            transform:rotate(-200deg)rotateX(130deg);
            animation: wingFlutter 0.1s ease-in-out infinite alternate;
        }

        .wing-right {
            right: 37px;
            top: -4px;
                        border-radius:20px 2px;
            transform:rotate(200deg)rotateX(-130deg);
            animation: wingFlutter 0.1s ease-in-out infinite  alternate;
        }



        @keyframes wingFlutter {
            0% { height:25px;width:30px;}
            100% { }
        }


        /* Prismatic light effects from wings */
        .wing-left::before,
        .wing-right::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg,
                transparent 0%,
                rgba(255, 0, 255, 0.4) 20%,
                rgba(0, 255, 255, 0.4) 40%,
                rgba(255, 255, 0, 0.4) 60%,
                rgba(255, 0, 0, 0.4) 80%,
                transparent 100%
            );
            border-radius: inherit;
            animation: prismEffect 2s linear infinite;
            opacity: 0.7;
        }

        .antennae {
            position: absolute;
            width: 2px;
            height: 12px;
            background: #8b4513;
            border-radius: 50% 50% 0 0;
            left: 20px;
            top: 8px;
        }

        .antennae::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 12px;
            background: #8b4513;
            border-radius: 50% 50% 0 0;
            left: 8px;
            top: 0;
        }

        /* Interactive elements */
        .floating-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8), transparent);
            border-radius: 50%;
            animation: floatUp 6s linear infinite;
        }

        .particle:nth-child(1) { left: 20%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 40%; animation-delay: 2s; }
        .particle:nth-child(3) { left: 60%; animation-delay: 4s; }
        .particle:nth-child(4) { left: 80%; animation-delay: 1s; }
        .particle:nth-child(5) { left: 30%; animation-delay: 3s; }

        /* Hover effects */
        .scene-container:hover .prism-weaver {
            animation-duration: 1s;
        }

        .scene-container:hover .wing-left::before,
        .scene-container:hover .wing-right::before {
            animation-duration: 0.5s;
        }

        /* Info panel */
        .info-panel {
            position: absolute;
            top:0px;
            left: 0px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 0 30px 5px 30px;
            max-width: 300px;
            font-size: 12px;
            line-height: 1.4;
        }

        /* Animations */
        @keyframes bugFloat {
            0%, 100% { transform: translateZ(50px) translateY(0px) rotate(0deg); }
            25% { transform: translateZ(50px) translateY(-8px) rotate(-2deg); }
            50% { transform: translateZ(50px) translateY(-5px) rotate(0deg); }
            75% { transform: translateZ(50px) translateY(-10px) rotate(2deg); }
        }

        @keyframes prismEffect {
            0% { 
                background: linear-gradient(45deg,
                    transparent 0%, rgba(255, 0, 255, 0.4) 20%, rgba(0, 255, 255, 0.4) 40%, 
                    rgba(255, 255, 0, 0.4) 60%, rgba(255, 0, 0, 0.4) 80%, transparent 100%);
            }
            33% { 
                background: linear-gradient(45deg,
                    rgba(255, 0, 0, 0.4) 0%, transparent 20%, rgba(255, 0, 255, 0.4) 40%, 
                    rgba(0, 255, 255, 0.4) 60%, rgba(255, 255, 0, 0.4) 80%, transparent 100%);
            }
            66% { 
                background: linear-gradient(45deg,
                    rgba(255, 255, 0, 0.4) 0%, rgba(255, 0, 0, 0.4) 20%, transparent 40%, 
                    rgba(255, 0, 255, 0.4) 60%, rgba(0, 255, 255, 0.4) 80%, transparent 100%);
            }
            100% { 
                background: linear-gradient(45deg,
                    transparent 0%, rgba(255, 0, 255, 0.4) 20%, rgba(0, 255, 255, 0.4) 40%, 
                    rgba(255, 255, 0, 0.4) 60%, rgba(255, 0, 0, 0.4) 80%, transparent 100%);
            }
        }

        @keyframes lightShift {
            0%, 100% { transform: translateZ(-100px) translateX(0px); }
            50% { transform: translateZ(-100px) translateX(-20px); }
        }

        @keyframes floatUp {
            0% { 
                bottom: -10px; 
                opacity: 0; 
                transform: translateX(0px); 
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { 
                bottom: 110vh; 
                opacity: 0; 
                transform: translateX(20px); 
            }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .prism-weaver {
                width: 40px;
                height: 30px;
            }
            
            .info-panel {
                bottom: 10px;
                left: 10px;
                right: 10px;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div class="scene-container" id="scene">
        <div class="parallax-layer sky-layer"></div>
        <div class="parallax-layer distant-trees"></div>
        <div class="parallax-layer forest-canopy"></div>
        <div class="parallax-layer tree-trunks"></div>
        <div class="parallax-layer forest-floor"></div>
        <div class="parallax-layer vegetation"></div>
        <div class="light-rays"></div>
        
        <div class="prism-weaver">
            <div class="antennae"></div>
            <div class="wing wing-left"></div>
            <div class="wing wing-right"></div>
            <div class="bug-body"></div>
        </div>

        <div class="floating-particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <div class="info-panel">
            <strong>Chromoptera prismatica</strong><br>
            <em>The Prism Weaver</em><br><br>
            Hover to observe prismatic wing refraction.<br>
            Notice the crystalline light patterns shifting across the wings as the insect navigates filtered forest sunlight.
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const bug = document.querySelector('.prism-weaver');
        let mouseX = 0, mouseY = 0;
        
        // Parallax mouse movement  
        scene.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - .5) * 2;
            mouseY = (e.clientY / window.innerHeight -.5) * 2;
            
            // Apply parallax to different layers
            const layers = document.querySelectorAll('.parallax-layer');
            layers.forEach((layer, index) => {
                const speed = (index + 1) * 0.5;
                layer.style.transform += ` translate(${mouseX * speed}px, ${mouseY * speed}px)`;
            });
            
            // Make bug subtly track mouse movement
            const offsetX = mouseX ;
            const offsetY = mouseY ;
            bug.style.transform = `translateZ(50px) translateX(${offsetX}px) translateY(${offsetY}px) rotate(${mouseX * 5}deg)`;
        });

        // Enhanced prismatic effects on click
        scene.addEventListener('click', () => {
            const wings = document.querySelectorAll('.wing');
            wings.forEach(wing => {
                wing.style.animation = 'wingFlutter 0.1s ease-in-out 10 alternate, prismEffect 0.3s linear 3';
                setTimeout(() => {
                    wing.style.animation = '';
                }, 1000);
            });
        });

        // Ambient light shifting
        let lightIntensity = 0;
        setInterval(() => {
            lightIntensity += 0.02;
            const intensity = Math.sin(lightIntensity) * 0.3 + 0.7;
            document.querySelector('.light-rays').style.opacity = intensity;
        }, 100);
    </script>
</body>
</html>
