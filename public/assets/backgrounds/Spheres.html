<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Orbital Shapes with Glowing Tiles</title>
    <style>
        html {background-color:black;}
        body { margin: 0;height:100vh; width:100vw; overflow:hidden;opacity:.6;animation:flow 120s linear infinite; transform:scale(1)}

        @keyframes flow {
            0% { opacity:1;filter:hue-rotate(0deg)contrast(1); }
            33% { opacity:1;filter:hue-rotate(90deg)contrast(2); }
            66% { opacity:1;filter:hue-rotate(-1090.2deg)contrast(1); }
            100% { opacity:1;filter:hue-rotate(0deg)contrast(3);}
        }
        canvas { display: block; background-color: black; }
        #menu {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
            opacity:0;
        }

        #menu:hover {
            opacity: 1;
        }
        #menu button {
            display: block;
            margin: 5px 0;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="menu">
    <button onclick="followShape(0)">Follow Shape 1</button>
    <button onclick="followShape(1)">Follow Shape 2</button>
    <button onclick="followShape(2)">Follow Shape 3</button>
    <button onclick="followShape(3)">Follow Shape 4</button>
    <button onclick="followShape(4)">Follow Shape 5</button>
    <button onclick="followShape(5)">Follow Shape 6</button>
        <button onclick="followShape(6)">Follow Shape 7</button>
    <button onclick="followShape(7)">Follow Shape 8</button>
    <button onclick="followShape(8)">Follow Shape 9</button>
    <button onclick="followShape(null)">Reset Camera</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // Initialize scene, camera, and renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 30000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Add lights
    const ambientLight = new THREE.AmbientLight(0x404040, 10.25);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xfff, 12);
    pointLight.position.set(50, 50, 50);
    scene.add(pointLight);

    // Add point light attached to the camera
    const cameraLight = new THREE.PointLight(0xffffff, .1);
    camera.add(cameraLight);
    scene.add(camera)

    const shapes = [];
    const shapesGeometries = [
        new THREE.DodecahedronGeometry(4), // Dodecahedron
        new THREE.IcosahedronGeometry(3), // Icosahedron
        new THREE.OctahedronGeometry(3), // Octahedron
        new THREE.IcosahedronGeometry(2), // Icosahedron Small
        new THREE.SphereGeometry(1, 32, 32), // Smaller Sphere
        new THREE.SphereGeometry(10, 32, 32), // Sphere
        new THREE.OctahedronGeometry(12), // Lg.  Octahedron
        new THREE.DodecahedronGeometry(21), // Lg.  Dodecahedron
        new THREE.IcosahedronGeometry(84), // Lg.  Icosahedron
    ];

    const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff, 0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff];

    for (let i = 0; i < 9; i++) {
        const material = new THREE.MeshStandardMaterial({ color: colors[i], transparent: true, opacity: 1, emissive: colors[i], emissiveIntensity: .1, metalness: 1, roughness: .3 });
        const shape = new THREE.Mesh(shapesGeometries[i], material);
        shapes.push(shape);
        scene.add(shape);

        // Add light
        const shapeLight = new THREE.PointLight(colors[i], 12,20);
        shape.add(shapeLight);
    }


    // Set camera position
    camera.position.set(10, 0, 0);
    camera.lookAt(0, 100, 0);

    // Orbital parameters
    const orbits = [
        { amplitude: 251, frequency: 8.1, tilt: -0.1 },
        { amplitude: 242, frequency: 3.1, tilt: 0.2 },
        { amplitude: 233, frequency: 1.1, tilt: -0.3 },
        { amplitude: 224, frequency: 1, tilt: 10.4 },
        { amplitude: 215, frequency: -3.1, tilt: -0.5 },
        { amplitude: 206, frequency: -4.1, tilt: 0.6 },
                { amplitude: 542, frequency: 3.1, tilt: 0.2 },
        { amplitude: 1233, frequency: 1.1, tilt: -0.3 },
        { amplitude: 9024, frequency: 1, tilt: 10.4 },

    ];

    // Create the grid as a stationary object
    const gridHelper = new THREE.GridHelper(21500, 30, 0x000, 0xfff);
        const gridHelper2 = new THREE.GridHelper(9150, 100, 0xf00, 0xf0);
      const gridHelper3 = new THREE.GridHelper(1850, 40, 0x0ff, 0x0ff);
            const gridHelper4 = new THREE.GridHelper(222050, 20, 0x0f0, 0x0f0);

gridHelper.rotation.x = Math.PI / 12;
gridHelper2.rotation.x = Math.PI / 3;
gridHelper3.rotation.x = Math.PI / 4.2;
gridHelper4.rotation.x = Math.PI / .2;
gridHelper.position.set(0, 0, 110);
gridHelper2.position.set(0, 530, 10);
gridHelper3.position.set(200, 10, 0);
gridHelper4.position.set(0, 50, -300);

    scene.add(gridHelper, gridHelper2, gridHelper3, gridHelper4);



    // Camera movement controls
    let keys = {};

    function onDocumentKeyDown(event) {
        keys[event.keyCode] = true;
    }

    function onDocumentKeyUp(event) {
        keys[event.keyCode] = false;
    }

    function updateCameraPosition() {
        let moveSpeed = 0.05;
        let maxSpeed = 200.0;
        let rotateSpeed = 0.03;
        let acceleration = 3.5;
        let damping = 100;

        if (keys[65]) {
            camera.rotation.x += (keys[40] ? rotateSpeed : 0) - (keys[38] ? rotateSpeed : 0);
            camera.rotation.y += (keys[37] ? rotateSpeed : 0) - (keys[39] ? rotateSpeed : 0);
        }

        if (keys[83]) {
            camera.rotation.x -= (keys[40] ? rotateSpeed : 0) - (keys[38] ? rotateSpeed : 0);
            camera.rotation.y -= (keys[37] ? rotateSpeed : 0) - (keys[39] ? rotateSpeed : 0);
        }

        if (keys[68]) {
            camera.rotation.x -= (keys[40] ? rotateSpeed : 0) - (keys[38] ? rotateSpeed : 0);
            camera.rotation.y -= (keys[37] ? rotateSpeed : 0) - (keys[39] ? rotateSpeed : 0);
        } else {
            let moveDirection = new THREE.Vector3();

            if (keys[38]) moveDirection.add(camera.getWorldDirection(new THREE.Vector3(0, 1, 0)));
            if (keys[40]) moveDirection.add(camera.getWorldDirection(new THREE.Vector3(0, 1, 0)).negate());
            if (keys[37]) moveDirection.add(camera.getWorldDirection(new THREE.Vector3(0, 1, 0)).cross(camera.up).normalize().negate());
            if (keys[39]) moveDirection.add(camera.getWorldDirection(new THREE.Vector3(0, 1, 0)).cross(camera.up).normalize());

            moveSpeed += acceleration;
            moveSpeed = Math.min(moveSpeed, maxSpeed);
            camera.position.add(moveDirection.multiplyScalar(moveSpeed));
            moveSpeed *= damping;
        }
    }

    document.addEventListener('keydown', onDocumentKeyDown, false);
    document.addEventListener('keyup', onDocumentKeyUp, false);

    let followedShape = null;

    function followShape(index) {
        followedShape = index !== null ? shapes[index] : null;
    }

    function smoothFollow(target, followSpeed) {
        const targetPosition = target.position.clone().add(new THREE.Vector3(0, 5, 0));
        camera.position.lerp(targetPosition, followSpeed);
        camera.lookAt(target.position);
    }

    function updateGrid() {
        if (followedShape) {
            gridHelper.rotation.setFromRotationMatrix(camera.matrixWorld);
        }
    }
followShape(1); 

// Follow shape at set interval
    setInterval(() => {
        const randomIndex = Math.floor(Math.random() * shapes.length);
        followShape(randomIndex);
    },120000);

// Animate the scene with time-based orbits
    function animate() { 
        requestAnimationFrame(animate);

        updateCameraPosition();
        updateGrid();

        let elapsedTime = performance.now() / 15000;

        shapes.forEach((shape, index) => {
            const orbit = orbits[index];
            shape.position.x = Math.sin(elapsedTime * orbit.frequency) * orbit.amplitude*3.2;
            shape.position.y = Math.sin(elapsedTime * orbit.frequency) * orbit.amplitude;
            shape.position.z = Math.cos(elapsedTime * orbit.frequency) * orbit.amplitude;

            // Apply tilt
            const tilt = orbit.tilt;
            shape.position.applyAxisAngle(new THREE.Vector3(0,0, 0), tilt);

            const distance = camera.position.distanceTo(shape.position);
            const maxDistance = 2500;

            const colorIntensity = Math.max(0.1, .75 - (distance / maxDistance));
        });

        if (followedShape) {
            smoothFollow(followedShape, .005);
        }

        renderer.render(scene, camera);
    
    }

    animate();
</script>
</body>
</html>
