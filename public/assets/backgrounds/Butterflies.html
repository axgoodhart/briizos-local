


<div id="app">
  <div id="hero">
  <a target="_blank" href="https://github.com/klevron/threejs-toys">github/threejs-toys</a>
  </div>
</div>

<style>
body, html, #app {
  margin: 0;
  width: 100%;
  height: 100%;
}
html{
background:linear-gradient(to top left, #2c003e, #8e24aa, #ff80ab);
animation:animated 700s infinite;background-color:black;
}
@keyframes animated {
0% {filter:blur(6px)brightness(0);;}
1.5% {filter:blur(0px)brightness(1)saturate(2)contrast(1.5)hue-rotate(0deg)}
95%{filter:blur(0px)brightness(1)saturate(1)contrast(1.5)hue-rotate(1800deg)}
100% {filter:blur(6px)brightness(0)}

}

#app {
  overflow: hidden;
  touch-action: pan-up;
  color: #000000;
  opacity:1;
  mix-blend-mode: difference;
  font-family: 'Montserrat', sans-serif;
  text-align: center;
  text-shadow: 0 0 5px #000000, 0 0 20px #000;
  user-select: none;
}

#app h1 {
  --fontSize: 1000px;
  --lineHeight: 10px;
  width: auto;
  height: calc(2 * var(--lineHeight));
  line-height: var(--lineHeight);
  margin: calc(50vh - var(--lineHeight)) auto 0;
  font-size: var(--fontSize);
}

#app a {
  margin-top: 10px;
  display: inline-block;
  text-decoration: none;
  color: #fff;
}

#app canvas {
  display: block;
  position: fixed;
  z-index: -1;
  top: 0;
}



</style>
<script type = "module">
import { butterfliesBackground } from 'https://unpkg.com/threejs-toys@0.0.7/build/threejs-toys.module.cdn.min.js'


const pc = butterfliesBackground({
  el: document.getElementById('app'),
  eventsEl: document.body,
  gpgpuSize: 5,
  background: 0x000,
  material: 'standard',
  materialParams: { transparent: true, wireframe: true,alphaTest: 0,opacity:1, metal:1,roughness: 0, clear:1, },
  texture: 'https://i.ibb.co/SYp3mHn/butterflies.png',
  textureCount: 4,
  wingsScale: [8.5, 1, 8.5],
  wingsWidthSegments: 22,
  wingsHeightSegments: 10, 
  wingsSpeed: .12,
  wingsDisplacementScale: 4.25,
  noiseTimeCoef: 0.0005,
  noiseIntensity: .001,
  attractionRadius1: 40, 
  attractionRadius2: 990, 
  maxVelocity: 1.1,
})
</script>
</body>
</html>
