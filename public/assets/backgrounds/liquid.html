<html lang=&quot;en&quot; >

<head>

  <title>Liquid Effect</title>

  
  
  
<style>
body, html, #liquidapp {
  margin: 0;

  height: 100%;
}

  top: 0;
  right: 0;

    <script id=&quot;rendered-js&quot; type=&quot;module&quot;>
import LiquidBackground from 'https://cdn.jsdelivr.net/npm/threejs-components@0.0.22/build/backgrounds/liquid1.min.js';

const liquidapp = LiquidBackground(document.getElementById('canvas'));

liquidapp.loadImage('https://i.imgur.com/UXFeYAC.jpeg');
liquidapp.liquidPlane.material.metalness = 1;
liquidapp.liquidPlane.material.roughness = 0;
liquidapp.liquidPlane.uniforms.displacementScale.value = 20;
liquidapp.setRain(true);
liquidapp.setRainTime(0.04);

let elapsed = 0;
let accumulator = 0;
const dropInterval = 0.09;
let lastTime = performance.now();

function addScriptedDrop() {
  const x =
    Math.sin(elapsed * 0.85) * 0.65 +
    Math.sin(elapsed * 0.27) * 0.2;
  const y =
    Math.cos(elapsed * 1.1) * 0.55 +
    Math.sin(elapsed * 0.5) * 0.25;
  const radius = 0.013 + (Math.sin(elapsed * 2.3) + 1) * 0.004;
  const strength = 0.0016 + (Math.cos(elapsed * 1.7) + 1) * 0.0011;

  liquidapp.liquidPlane.addDrop(x, y, radius, strength);
}

function animate(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  elapsed += dt;
  accumulator += dt;

  while (accumulator >= dropInterval) {
    addScriptedDrop();
    accumulator -= dropInterval;
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

  </script>
