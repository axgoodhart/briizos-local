<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Drift</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background-color: black;
            filter: contrast(2) saturate(.6) brightness(.6);
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg,
                #6f7dd570 0%,
                #2f3b5e8c 30%,
                #190e627b 60%,
                #774704 97%,
                rgb(67, 8, 8) 100%), linear-gradient(to top left, #2c003e, #8e24aa, #cf0347);
            background-size: cover;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            filter: saturate(.8) brightness(1.5) hue-rotate(-10deg);
        }

@keyframes spinin {
  0% {opacity:0;
    transform: scale(25)rotate(2160deg);
  }
50%{transform:scale(12.5)rotate(0deg);}
  100% {
    transform: scale(1);
}
}


        .star-field { 
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .star {
            position: absolute;
            opacity: 0;
            color:white;
            font-family: Corundum Text Light SC Italic;
            pointer-events: none;
            text-shadow: 0 0 2px currentColor;
        }

        /* Near stars - larger, brighter, faster drift */
        .star.near {
            font-size: 13px;
            animation: twinkle-near 3s ease-in-out infinite, drift-near 60s linear infinite;
        }

        /* Mid-distance stars */
        .star.mid {
            font-size: 7px;
            animation: twinkle-mid 4s ease-in-out infinite, drift-mid 90s linear infinite;
        }

        /* Far stars - smallest, subtlest */
        .star.far {
            font-size: 4px;
            animation: twinkle-far 5s ease-in-out infinite, drift-far 120s linear infinite;
        }

        /* Color variations */
        .star.blue { color: #a8d8ff; filter: blur(0.3px); }
        .star.white { color: #ffffff; filter: blur(0.2px); }
        .star.yellow { color: #fff4d6; filter: blur(0.25px); }
        .star.purple { color: #d4c5f9; filter: blur(0.35px); }
        .start.pink {color:pink; filter:contrast(100);}
        .star.orange {color:orange; filter:contrast(100);}
        .star.silver {color:silver; filter:contrast(100);}

        /* Twinkling animations with varying rhythms */
        @keyframes twinkle-near {
            0%, 100% { 
                opacity: 0.4; 
                transform: scale(1);
                filter: blur(0px);
            }
            25% { 
                opacity: 0.9; 
                transform: scale(1.3);
                filter: blur(1px);
            }
            50% { 
                opacity: 0.5; 
                transform: scale(1.1);
                filter: blur(0.02px);
            }
            75% { 
                opacity: 0.95; 
                transform: scale(1.25);
                filter: blur(0.15px);
            }
        }

        @keyframes twinkle-mid {
            0%, 100% { 
                opacity: 0.3; 
                transform: scale(1);
            }
            30% { 
                opacity: 0.5; 
                transform: scale(1.2);
            }
            36% { 
                opacity: 0.8; 
                transform: scale(2.5);
            }

            40% { 
                opacity: 1; 
                transform: scale(.15);
            }

            60% { 
                opacity: 0.4; 
                transform: scale(1.05);
            }
        }

        @keyframes twinkle-far {
            0%, 100% { 
                opacity: 0.2; 
                transform: scale(1);
            }
            40% { 
                opacity: 0.6; 
                transform: scale(1.15);
            }
        }

        /* Drift animations - horizontal movement */
        @keyframes drift-near {
            0% { transform: translateX(0) translateY(0) rotate(0deg); }
            100% { transform: translateX(-100vw) translateY(20vh) rotate(360deg); }
        }

        @keyframes drift-mid {
            0% { transform: translateX(0) translateY(0) rotate(0deg); }
            100% { transform: translateX(-80vw) translateY(15vh) rotate(360deg); }
        }

        @keyframes drift-far {
            0% { transform: translateX(0) translateY(0) rotate(0deg); }
            100% { transform: translateX(-60vw) translateY(10vh) rotate(360deg); }
        }

        /* Stagger animation delays for more organic feel */
        .star:nth-child(3n) { animation-delay: -1s; }
        .star:nth-child(3n+1) { animation-delay: -2s; }
        .star:nth-child(3n+2) { animation-delay: -0.5s; }
        .star:nth-child(5n) { animation-delay: -1.5s; }
        .star:nth-child(7n) { animation-delay: -2.5s; }
    </style>
</head>
<body>
    <div class="star-field" id="starfield"></div>

    <script>
        // Isolated scope - prevent global pollution
        (function() {
            'use strict';

            const starfield = document.getElementById('starfield');
            const characters = [ '*','•','°','·','‚','›','‡', '·', '•', 'AG','𝄞', '°', '◆' ,'𝄵','𝄫','♮','♯','♬','𝄢','𝄾','𝄋','♩','𝄐','𝄪' ];
            const depths = ['near', 'mid', 'far'];
            const colors = ['blue', 'white', 'pink', 'orange', 'yellow', 'silver'];

            // Create multiple layers of stars
            const starCounts = { near: 10, mid: 50, far: 810 };

            for (const [depth, count] of Object.entries(starCounts)) {
                for (let i = 0; i < count; i++) {
                    const star = document.createElement('div');
                    star.className = `star ${depth} ${colors[Math.floor(Math.random() * colors.length)]}`;
                    star.textContent = characters[Math.floor(Math.random() * characters.length)];

                    // Random positioning across the viewport (including off-screen right for drift effect)
                    star.style.left = `${Math.random() * 120}%`;
                    star.style.top = `${Math.random() * 90}%`;

                    // Add subtle random delay variation
                    star.style.animationDelay = `${-Math.random() * 12}s, ${-Math.random() * 20}s`;

                    starfield.appendChild(star);
                }
            }
        })();
    </script>
</body>
</html>
