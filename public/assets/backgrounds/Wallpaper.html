    <meta charset="UTF-8">

    <title>Background Selector</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: url('https://static.wixstatic.com/media/58c99c_82bc6dcf20134df4ac2cfb84c8f10480~mv2.png') no-repeat center center fixed;
            background-size: cover;
            transition: background 0.7s ease-in-out;
        }
        .selector {
            position: fixed;
            top: 10%;
            right: 2%;
            background: rgba(22, 31, 45, 0.75);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.726);
            display: flex;
            border: 4px inset #0aff3b;
            align-items: center;
            gap: 30px;
            overflow: hidden;
            max-width: 60%;
            visibility: hidden;
            z-index: 1000; /* Add a high z-index to ensure it’s on top */

        }
        .thumbnail-container {
    display: flex;
    overflow-x: auto;
    width: 35%px;
    height: fit-content;
    -ms-overflow-style: none;  /* IE and Edge */
    scrollbar-width: none;     /* Firefox */
}
.thumbnail-container::-webkit-scrollbar {
    display: none;             /* Chrome, Safari and Opera */
}        .selector img {
            width: 200px;
            height: 120px;
            gap: 60px;
            border: 4px solid transparent;
            margin: 10px;
            border-radius: 18px;
            cursor: pointer;
            transition: transform 0.3s, border-color 0.3s;
        }
        .selector img:hover {
            transform: scale(1.05);
            border-color: #ffffff8e;
        }
        .selector img.selected {
            border-color: #00FF00;
        }
        .change-arrow {
            font-size: 0.4em;
            cursor: pointer;
            color: #00FF00;
        }
        @keyframes glow {
            0% { text-shadow: 0 0 5px #00FF00; }
            100% { text-shadow: 0 0 20px #00FF00; }
        }
    </style>
</head>

<div id="emoji-container"></div>

<script>
    let currentBackground = 'https://i.imgur.com/jpaUTeY.jpeg';

    function scrollLeft() {
        const container = document.getElementById('thumbnail-container');
        container.scrollLeft -= 500;
    }

    function scrollRight() {
        const container = document.getElementById('thumbnail-container');
        container.scrollLeft += 500;
    }

    function changeBackground(imageUrl) {
        if (currentBackground !== imageUrl) {
            document.body.style.backgroundImage = `url(${imageUrl})`;
            currentBackground = imageUrl;
            updateSelected(imageUrl);
        }
    }

    function updateSelected(imageUrl) {
        const images = document.querySelectorAll('.selector img');
        images.forEach(img => {
            if (img.src === imageUrl) {
                img.classList.add('selected');
            } else {
                img.classList.remove('selected');
            }
        });
    }


    // Simplified scroll handling
    const thumbnailContainer = document.getElementById('thumbnail-container');
    thumbnailContainer.addEventListener('wheel', (event) => {
        event.preventDefault();
        thumbnailContainer.scrollLeft += event.deltaY;
    });

    function addClockAndCameraEmojis() {
        const emojiContainer = document.getElementById('emoji-container');
        emojiContainer.style.position = 'fixed';
        emojiContainer.style.top = '20px';
        emojiContainer.style.right = '20px';
        emojiContainer.style.display = 'flex';
        emojiContainer.style.alignItems = 'center';
        emojiContainer.style.zIndex = '10001';

        const cameraEmoji = document.createElement('div');
        cameraEmoji.textContent = '📷';
        cameraEmoji.style.fontSize = '30px';
        cameraEmoji.style.cursor = 'pointer';
        cameraEmoji.style.marginRight = '10px';

        cameraEmoji.addEventListener('click', () => {
            const selector = document.getElementById('background-selector');
            selector.style.visibility = 'visible';
        });

        emojiContainer.appendChild(cameraEmoji);
    }

    addClockAndCameraEmojis();
</script>
