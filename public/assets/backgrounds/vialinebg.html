<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generative Art Animation</title>
<style>
    html{
          filter:saturate(12);

    background:conic-gradient(from 180deg, #ff0080, #00ffff, #ffff00, #ff0080),radial-gradient(circle, rgba(255,255,255,0.2), transparent 60%)

    }
    body {
        margin: 0;
        overflow: hidden;
        background-color: #000000;
        height:100vh;
        transform-style:preserve-3d;
        mix-blend-mode:multiply;
        perspective:400px;
box-shadow: 0 0 20px white, inset 0 0 60px teal, 0 0 200px blue, inset 0 0 80px purple;    }
  


canvas {
        display: block;
        transform-style:preserve-3d;
        transform:scaleY(2);
    }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
<script>
    function setup() {
        createCanvas(windowWidth, windowHeight);
    }

    function draw() {
        background(0, 25);
        translate(width / 2, height / 2);
        
        noFill();
        stroke(255, 10);
        strokeWeight(.6);

        const time = frameCount * 0.01;
        const numLines = 3; 
        const numPoints = 80 

        for (let i = 0; i < numLines; i++) {
            const linePhase = (i / numLines) * TWO_PI; 

            beginShape();
            for (let j = 0; j <= numPoints; j++) {
                const pointPhase = j / numPoints;
                
                const y = map(pointPhase, 0, 1, -height / 2.5, height / 2.5);

                const envelope = sin(pointPhase * PI);
                const wave1 = sin(time + linePhase) / 60;
                const wave2 = sin(pointPhase * 8 + time * 2) * 40 * Math.sin(time);
                const centerComplexity = pow(cos(pointPhase * PI - HALF_PI), 2) * 1100;
                const wave3 = cos(linePhase * 4 - time) * centerComplexity;
                const x = envelope * (wave1 + wave2 + wave3 + 60);

                vertex(-x, y); 
            }
            endShape();

            beginShape();
            for (let j = 0; j <= numPoints; j++) {
                const pointPhase = j / numPoints;
                const y = map(pointPhase, 0, 1, -height, height / 1.5);
                
                const envelope = sin(pointPhase * PI * PI);
                const wave1 = sin(time + linePhase) * 60;
                const wave2 = sin(pointPhase * 8 + time * 2) * 40;
                const centerComplexity = pow(cos(pointPhase * PI - HALF_PI), 2) * 10;
                const wave3 = cos(linePhase * 4 - time) * centerComplexity;
                const x = envelope * (wave1 + wave2 + wave3 + 60);

                vertex(y*x, x+x/x);
            }
            endShape();
        }
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
    }
</script>
