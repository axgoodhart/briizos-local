<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Orbit Transition</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      body {
        min-height: 100svh;
      }

      main {
        display: grid;
        min-height: 100svh;
        place-items: center;
      }

      .orbit-stage {
        transition:all .5s;
        position: relative;
        display: grid;
        width: min(72vmin, 44rem);
        aspect-ratio: 996 / 1002;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        isolation: isolate;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .orbit-stage:hover{
        transform:scale(.5)


      }
      .orbit-stage:focus-visible {
        outline: 2px solid rgb(255 255 255 / 0.75);
        outline-offset: clamp(0.75rem, 2vmin, 1.5rem);
        border-radius: 50%;
      }

      .orbit-stage:disabled {
        cursor: default;
      }

      .orbit-image {
        grid-area: 1 / 1;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }

      .orbit-image--outline {
        position: relative;
        z-index: 2;
        opacity: 1;
        transform: rotate(0deg) scale(1);
        filter: brightness(1)blur(0);
      }

      .orbit-image--color {
        position: relative;
        z-index: 1;
        opacity: 0;
        transform: scale(0.92);
      }


      .orbit-stage.is-transforming{
        pointer-events:none
      }

      .orbit-stage.is-transforming .orbit-image--outline {
        animation: outline-transition 1.425s linear forwards;
        will-change: transform, filter, opacity;
      }

      .orbit-stage.is-transforming .orbit-image--color {
        animation: color-arrival .9s linear forwards;
        will-change: transform, opacity;
        animation-delay:.75s;
        animation-direction: reverse;
      }

      /*
       * Rotation distance grows between the middle keyframes, then contracts.
       * That makes the logo visibly accelerate before easing back down.
       */
      @keyframes outline-transition {
        0% {
          opacity: 1;
          transform: rotate(0deg) scale(1);
          filter: brightness(1)blur(0px);
        }

        6% {
          opacity: 1;
          transform: rotate(5deg) scale(0.5);
          filter: brightness(0)blur(0px);
        }

        15% {
          opacity: 1;
          transform: rotate(22.5deg) scale(.31);
          filter: brightness(.1)blur(0px);
        }

        20% {
          opacity: 1;
          transform: rotate(67.5deg) scale(.41);
          filter: brightness(.3)blur(0px);
        }

        32% {
          opacity: 1;
          transform: rotate(140deg) scale(1);
          filter: brightness(1)blur(2px);
        }

        46% {
          opacity: 1;
          transform: rotate(500deg) scale(1);
          filter: brightness(1)blur(2px);
        }

        60% {
          opacity: 1;
          transform: rotate(900deg) scale(1);
          filter: brightness(1)blur(2px);
        }

        72% {
          opacity: 0.96;
          transform: rotate(1200deg) scale(1);
          filter: brightness(1)blur(2px);
        }

        82% {
          opacity: 0.72;
          transform: rotate(1550deg) scale(0.995);
        }

        90% {
          opacity: 0.38;
          transform: rotate(1650deg) scale(0.985);
          filter: brightness(2)blur(100px);
        }

        96% {
          opacity: 0.1;
          transform: rotate(1700deg) scale(0.975);
          filter: brightness(1)blur(50px);
        }

        100% {
          opacity: 0;
          transform: rotate(1800deg) scale(0.97);
          filter: brightness(1)blur(0);
        }
      }

      @keyframes color-arrival {
        0% {
          opacity: 1;
          transform: rotate(-0deg) scale(1);
          filter: brightness(1)blur(0);
        }

        12% {
          opacity: 1;
          transform: rotate(-45deg) scale(1);
          filter: brightness(2)blur(2px);
        }

        20% {
          opacity: 1;
          transform: rotate(-135deg) scale(1);
          filter: brightness(1.5)blur(4px);
        }

        32% {
          opacity: 1;
          transform: rotate(-405deg) scale(1);
          filter: brightness(1.2)blur(7px);
        }

        46% {
          opacity: 1;
          transform: rotate(-900deg) scale(1);
          filter: brightness(1)blur(12px);
        }

        60% {
          opacity: 1;
          transform: rotate(-1620deg) scale(1);
          filter: brightness(1)blur(18px);
        }

        72% {
          opacity: 0.96;
          transform: rotate(-2520deg) scale(1);
          filter: brightness(1)blur(16px);
        }

        82% {
          opacity: 0.72;
          transform: rotate(-3180deg) scale(0.995);
          filter: brightness(1)blur(10px);
        }

        90% {
          opacity: 0.38;
          transform: rotate(-3540deg) scale(0.985);
          filter: brightness(1)blur(5px);
        }

        96% {
          opacity: 0.1;
          transform: rotate(-3690deg) scale(0.975);
          filter: brightness(1)blur(2px);
        }

        100% {
          opacity: 0;
          transform: rotate(-3720deg) scale(0.97);
          filter: brightness(1)blur(0);
        }
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .orbit-stage.is-transforming .orbit-image--outline {
          animation: outline-fade 250 ease forwards;
        }

        .orbit-stage.is-transforming .orbit-image--color {
          animation: color-fade 250 ease forwards;
        }

        @keyframes outline-fade {
          to {
            opacity: 0;
          }
        }

        @keyframes color-fade {
          to {
            opacity: 1;
            transform: scale(1);
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <button class="orbit-stage" type="button" aria-describedby="orbit-instruction">
        <img
          class="orbit-image orbit-image--color"
          src="./orbit-transition-assets/orbit-color.png"
          alt=""
          draggable="false"
          decoding="sync"
        />
        <img
          class="orbit-image orbit-image--outline"
          src="./orbit-transition-assets/orbit-outline.png"
          alt="White outlined orbit character"
          draggable="false"
          decoding="sync"
          fetchpriority="high"
        />
      </button>
      <span class="visually-hidden" id="orbit-instruction">
        Activate the image to reveal its color form.
      </span>
    </main>

    <script>
      const stage = document.querySelector(".orbit-stage");
      const outline = document.querySelector(".orbit-image--outline");

      stage.addEventListener(
        "click",
        () => {
          stage.classList.add("is-transforming");
        },
        { once: true },
      );

      outline.addEventListener(
        "animationend",
        () => {
          stage.disabled = true;
          stage.setAttribute("aria-label", "Color orbit character revealed");
        },
        { once: true },
      );
    </script>
  </body>
</html>
